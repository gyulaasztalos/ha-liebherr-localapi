name: Release

# Publish a GitHub release when a version tag is pushed. HACS offers releases
# as updates, so the tag must match the version in manifest.json.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          MANIFEST_VERSION=$(jq -r .version custom_components/liebherr_localapi/manifest.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${MANIFEST_VERSION}" != "${TAG_VERSION}" ]
          then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${MANIFEST_VERSION}"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
