name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest -p no:cacheprovider

  # Home Assistant APIs scheduled for removal. Pinned rules (no network), so only
  # a Renovate bump of the action brings in new removals, and that PR goes red
  # instead of an unrelated one.
  breakage-radar:
    name: Breakage Radar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Third-party action, so pinned by commit; Renovate updates SHA and comment
      - uses: Booyaka101/hass-breakage-radar@95be4d1f05e77056bc536294fd91d790d5026328 # v1.20.0
        with:
          fail-on: any
          python-version: "3.14"
